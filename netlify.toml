# ── الأنيس | إعدادات نشر Netlify ─────────────────────────────────────
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# نفس قواعد public/_redirects، مكتوبة هنا أيضاً كتوثيق صريح.
# (Netlify يدمج الاثنين، وقواعد netlify.toml لها الأسبقية.)
[[redirects]]
  from = "/api/*"
  to = "https://al-anis-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
